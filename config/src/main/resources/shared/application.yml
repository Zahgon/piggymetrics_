logging:
  level:
    org.springframework.security: INFO

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://registry:8761/eureka/

spring:
  rabbitmq:
    host: rabbitmq
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:5000/uaa/oauth2/jwks
  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
